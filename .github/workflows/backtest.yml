name: backtest

# Backtests the crypto bot and the gold EA strategy on real history
# (Binance 4h klines, Dukascopy XAUUSD H1) with the repo's own strategy code,
# then commits the report to research/backtests/<date>/.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 2 * *"   # monthly refresh, 2nd of the month

permissions:
  contents: write
  actions: read

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt matplotlib
      - run: python -m unittest discover -s tests -t .
      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: bt/raw
          key: bt-raw-${{ github.run_id }}
          restore-keys: bt-raw-
      - name: Seed history from the repo snapshot
        run: |
          mkdir -p bt/data bt/results
          if ls research/data/*.csv >/dev/null 2>&1; then
            cp research/data/*.csv bt/data/ && cp research/data/fetch_*.json bt/results/
          fi
      - name: Seed history from the 2026-11-05 run (one-off, until research/data exists)
        if: hashFiles('research/data/*.csv') == ''
        uses: actions/download-artifact@v4
        with:
          name: backtest-41986557897
          run-id: 41986557897
          github-token: ${{ github.token }}
          path: bt-prev
      - name: Use seeded artifact
        if: hashFiles('research/data/*.csv') == ''
        run: cp bt-prev/data/*.csv bt/data/ && cp bt-prev/results/fetch_*.json bt/results/
      - name: Run backtests
        env:
          DUKA_PAUSE: "5"
        run: python research/backtest_runner.py --code-dir . --base bt all
      - name: Daily trend study
        run: python research/daily_trend_study.py --base bt | tee bt/daily_trend.md
      - name: Write report
        run: |
          day=$(date -u +%F)
          out="research/backtests/$day"
          mkdir -p "$out"
          python research/backtest_runner.py --code-dir . --base bt summary | tail -n +2 > "$out/report.md"
          cp bt/daily_trend.md "$out/"
          python research/make_report.py --base bt --out "$out"
          cp bt/results/*.json "$out/"
          rm -f "$out/baseline_trades.json"
          mkdir -p research/data && cp bt/data/*.csv bt/results/fetch_*.json research/data/
          echo "REPORT_DIR=$out" >> "$GITHUB_ENV"
          cat "$out/report.md"
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ github.run_id }}
          path: |
            bt/results
            bt/data
          retention-days: 30
      - name: Commit report
        run: |
          git config user.name "trader-bot"
          git config user.email "trader-bot@users.noreply.github.com"
          git add research/backtests research/data
          git diff --cached --quiet && exit 0
          git commit -m "Backtest report $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
