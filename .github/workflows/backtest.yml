name: backtest

# Backtests the crypto bot and the gold EA strategy on real history
# (Binance 4h klines, Dukascopy XAUUSD H1) with the repo's own strategy code,
# then commits the report to research/backtests/<date>/.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 2 * *"   # monthly refresh, 2nd of the month

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .
      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: bt/raw
          key: bt-raw-${{ github.run_id }}
          restore-keys: bt-raw-
      - name: Run backtests
        env:
          DUKA_PAUSE: "5"
        run: python research/backtest_runner.py --code-dir . --base bt all
      - name: Daily trend study
        run: python research/daily_trend_study.py --base bt | tee bt/daily_trend.md
      - name: Write report
        run: |
          day=$(date -u +%F)
          out="research/backtests/$day"
          mkdir -p "$out"
          python research/backtest_runner.py --code-dir . --base bt summary | tail -n +2 > "$out/report.md"
          cp bt/daily_trend.md "$out/"
          cp bt/results/*.json "$out/"
          rm -f "$out/baseline_trades.json"
          echo "REPORT_DIR=$out" >> "$GITHUB_ENV"
          cat "$out/report.md"
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ github.run_id }}
          path: |
            bt/results
            bt/data
          retention-days: 30
      - name: Commit report
        run: |
          git config user.name "trader-bot"
          git config user.email "trader-bot@users.noreply.github.com"
          git add research/backtests
          git diff --cached --quiet && exit 0
          git commit -m "Backtest report $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
