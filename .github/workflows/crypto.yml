name: crypto

on:
  schedule:
    - cron: "7 * * * *"   # hourly; 4h signals act on candle close, stops checked every hour
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute decisions without trading or saving state"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: crypto
  cancel-in-progress: false

jobs:
  crypto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .
      - name: Run crypto bot
        env:
          EXCHANGE_API_KEY: ${{ secrets.EXCHANGE_API_KEY }}
          EXCHANGE_API_SECRET: ${{ secrets.EXCHANGE_API_SECRET }}
          ALLOW_LIVE: ${{ vars.ALLOW_LIVE_CRYPTO }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python -m trading.crypto_bot
      - name: Commit state and log
        if: always()
        run: |
          git config user.name "trader-bot"
          git config user.email "trader-bot@users.noreply.github.com"
          git add state logs/crypto.jsonl 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Crypto bot run $(date -u +'%F %H:%M')"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
