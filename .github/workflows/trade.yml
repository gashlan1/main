name: trade

on:
  schedule:
    # Hourly on weekdays across US market hours (13:00-20:00 UTC covers EST and EDT).
    # GitHub often starts scheduled runs hours late, so hourly runs make it likely that
    # some land while the market is open. The bot checks the market clock itself.
    - cron: "17 13-20 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute decisions without sending orders"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trade
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.keys.outputs.configured }}
    steps:
      - id: keys
        env:
          KEY: ${{ secrets.ALPACA_API_KEY }}
          SECRET: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          if [ -n "$KEY" ] && [ -n "$SECRET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Stock bot is idle: add the ALPACA_API_KEY and ALPACA_SECRET_KEY repository secrets to start it."
          fi

  trade:
    needs: check
    if: needs.check.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .
      - name: Run trader
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALLOW_LIVE: ${{ vars.ALLOW_LIVE }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python bot/trader.py
      - name: Commit trade log
        if: always()
        run: |
          git config user.name "trader-bot"
          git config user.email "trader-bot@users.noreply.github.com"
          git add logs/trades.jsonl || true
          git diff --cached --quiet && exit 0
          git commit -m "Trade log $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
