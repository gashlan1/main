name: trade

on:
  schedule:
    # Weekdays, roughly 30 min after the US open and 30 min before the close (UTC).
    # The bot checks the market clock itself, so DST shifts are harmless.
    - cron: "45 14 * * 1-5"
    - cron: "30 19 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute decisions without sending orders"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Run trader
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALLOW_LIVE: ${{ vars.ALLOW_LIVE }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python bot/trader.py
      - name: Commit trade log
        if: always()
        run: |
          git config user.name "trader-bot"
          git config user.email "trader-bot@users.noreply.github.com"
          git add logs/trades.jsonl || true
          git diff --cached --quiet || (git commit -m "Trade log $(date -u +%F)" && git push)
