<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>مدارس الصرح الأهلية · عرض تجريبي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* Layout: a bursar's ledger. Burgundy crest band, hairline-ruled tables on desktop, thumb-first card lists and a bottom bar on phones; gold marks the figures and states that matter. */
:root{
  --paper:#ffffff; --wash:#f8f6f4; --ink:#171314; --ink-2:#4d4547; --ink-3:#857b7d; --rule:#ebe5e2; --rule-2:#d9d0cd;
  --brand:#6b1f2e; --brand-2:#7d2a3b; --brand-soft:#f6eaec;
  --gold:#94701c; --gold-2:#c9a24a; --gold-soft:#f7efdb;
  --ok:#2c6a3d; --ok-soft:#e6f2e9; --warn:#8a5c0b; --warn-soft:#f9efd8; --bad:#b4261d; --bad-soft:#fce8e6; --on-bad:#ffffff;
  --btn:#171314; --btn-ink:#ffffff;
  --band:#5c1a28; --band-ink:#fbf3e3; --band-mute:#dcc3a6; --band-line:rgba(251,243,227,.38); --band-hover:rgba(255,255,255,.08);
  --scrim:rgba(23,19,20,.42); --shadow:0 1px 2px rgba(23,19,20,.06),0 12px 32px rgba(23,19,20,.16);
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --s1:#a23b52; --s2:#b08a2e; --track:#f3e3e7;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141112; --wash:#1c1819; --ink:#f3eeeb; --ink-2:#cdc4c2; --ink-3:#958a8c; --rule:#2c2628; --rule-2:#3e3537;
    --brand:#e09aa7; --brand-2:#c46f80; --brand-soft:#2e181d;
    --gold:#d8b462; --gold-2:#e3c47e; --gold-soft:#2c2515;
    --ok:#82c796; --ok-soft:#17291c; --warn:#e5bb62; --warn-soft:#2d2513; --bad:#f39a90; --bad-soft:#341a18; --on-bad:#1a0f0e;
    --btn:#f3eeeb; --btn-ink:#141112;
    --band:#2b0e15; --band-ink:#f6ecd8; --band-mute:#bf9f80; --band-line:rgba(246,236,216,.3); --band-hover:rgba(255,255,255,.06);
    --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.55);
    --s1:#bf5f73; --s2:#b08a35; --track:#3a2026;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141112; --wash:#1c1819; --ink:#f3eeeb; --ink-2:#cdc4c2; --ink-3:#958a8c; --rule:#2c2628; --rule-2:#3e3537;
  --brand:#e09aa7; --brand-2:#c46f80; --brand-soft:#2e181d;
  --gold:#d8b462; --gold-2:#e3c47e; --gold-soft:#2c2515;
  --ok:#82c796; --ok-soft:#17291c; --warn:#e5bb62; --warn-soft:#2d2513; --bad:#f39a90; --bad-soft:#341a18; --on-bad:#1a0f0e;
  --btn:#f3eeeb; --btn-ink:#141112;
  --band:#2b0e15; --band-ink:#f6ecd8; --band-mute:#bf9f80; --band-line:rgba(246,236,216,.3); --band-hover:rgba(255,255,255,.06);
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.55);
  --s1:#bf5f73; --s2:#b08a35; --track:#3a2026;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button,label.btn,.fchip,.tab,.bn{touch-action:manipulation}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:28px;line-height:1.2}
h2{font-size:17px;line-height:1.3}
h3{font-size:15px}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.92em}
.muted{color:var(--ink-3)}
.sm{font-size:13px}
.bad-t{color:var(--bad)} .ok-t{color:var(--ok)} .gold-t{color:var(--gold)}
.nowrap{white-space:nowrap}
.grow{flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;opacity:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ico{width:16px;height:16px;flex:none}
[dir="rtl"] .flip{transform:scaleX(-1)}

/* band */
.band{background:var(--band);color:var(--band-ink)}
.band-inner{max-width:1200px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
.crest{color:var(--gold-2);display:flex;flex:none}
.crest svg{width:40px;height:40px}
.band-text{min-width:0;flex:1}
.school-name{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.band-sub{font-size:12.5px;color:var(--band-mute);display:flex;flex-wrap:wrap;column-gap:6px}
.band-actions{display:flex;align-items:center;gap:8px;flex:none}
.lang-btn{background:transparent;border:1px solid var(--band-line);color:var(--band-ink);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;min-height:34px;display:inline-flex;align-items:center;gap:6px}
.lang-btn:hover{background:var(--band-hover)}
.who{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--band-mute)}
.who img{width:24px;height:24px;border-radius:50%}

/* desktop tabs */
.nonav .tabs{display:none}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--paper);border-bottom:1px solid var(--rule)}
.tabs-inner{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs-inner::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:6px;padding:13px 12px 11px;border:0;border-bottom:2px solid transparent;background:none;color:var(--ink-2);font-weight:500;font-size:14.5px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--gold-soft);color:var(--gold);font-size:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}

/* phone bottom bar */
.bnav{display:none}

/* page */
main{max-width:1200px;margin:0 auto;padding-block:22px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.page-head{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:end;gap:12px 10px}
.ph-title{min-width:0}
.page-head .sub{color:var(--ink-3);margin-top:2px}
.ph-tools,.ph-actions{display:flex;flex-wrap:wrap;gap:8px}
.notice{padding:10px 14px;border-radius:var(--r);background:var(--wash);border:1px solid var(--rule);font-size:14px;color:var(--ink-2)}
.notice.gold{background:var(--gold-soft);border-color:transparent;color:var(--ink)}
.notice.bad{background:var(--bad-soft);border-color:transparent;color:var(--ink)}
.notice.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.notice.ok{background:var(--ok-soft);border-color:transparent;color:var(--ink)}
.link{background:none;border:0;padding:0;color:var(--brand);font-weight:500;text-decoration:underline;text-underline-offset:2px;cursor:pointer}

/* kpis */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:1000px){.kpis{grid-template-columns:repeat(var(--n,4),minmax(0,1fr))}}
@media (max-width:999px){.kpis>.kpi:last-child:nth-child(odd){grid-column:1/-1}}
.kpi{border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi-l{font-size:13px;color:var(--ink-3);font-weight:500}
.kpi-v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25;overflow-wrap:anywhere}
.kpi-s{font-size:13px;color:var(--ink-2)}
.kpi-s.bad{color:var(--bad)}
.meter{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin-block:4px 2px}
.meter i{display:block;height:100%;background:var(--gold)}

/* panels */
.grid2{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{border:1px solid var(--rule);border-radius:var(--r);background:var(--paper);min-width:0;display:flex;flex-direction:column}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.ph-meta{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.panel-b{padding:2px 0}
.panel-f{padding:10px 16px;border-top:1px solid var(--rule)}
.empty-sm{padding:16px;color:var(--ink-3);font-size:14px}
.list{list-style:none;margin:0;padding:0}
.list.boxed{border:1px solid var(--rule);border-radius:var(--r)}
.list li{display:flex;align-items:center;gap:8px 12px;padding:11px 16px;border-bottom:1px solid var(--rule)}
.list li:last-child{border-bottom:0}
.list li.li-wrap{flex-wrap:wrap}
.li-main{flex:1 1 160px;min-width:0;display:flex;flex-direction:column;align-items:flex-start;text-align:start;background:none;border:0;padding:0;cursor:pointer;color:inherit}
.li-main.static{cursor:default}
.li-main:not(.static):hover .li-t{text-decoration:underline;text-underline-offset:2px}
.li-t{font-weight:500;overflow-wrap:anywhere}
.li-s{font-size:13px;color:var(--ink-3);overflow-wrap:anywhere}
.li-end{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;text-align:end;max-width:55%}
.li-v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.li-v.bad{color:var(--bad)}
.li-acts{flex-basis:100%;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.list li.voided .li-v{text-decoration:line-through;color:var(--ink-3)}
.btns{display:inline-flex;flex-wrap:wrap;gap:6px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-weight:600;font-size:14px}
.steps li>div{flex:1 1 220px;min-width:0}
.step-t{font-weight:600}
.steps p{color:var(--ink-2);font-size:14px}
.start-sample{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--wash);border-radius:0 0 var(--r) var(--r)}
.start-sample p{flex:1 1 260px;font-size:14px;color:var(--ink-2)}
.today-cta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--rule)}
.menu-btn{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;background:none;border:0;font-size:16px;font-weight:500;color:var(--ink);cursor:pointer;text-align:start}
.menu-btn .ico{width:20px;height:20px;color:var(--ink-2)}
.menu li{padding:0}

/* charts */
.chart{padding:14px 16px 12px}
.bars{display:grid;grid-template-columns:repeat(var(--cols,12),minmax(0,1fr));gap:6px;align-items:end;height:140px;border-bottom:1px solid var(--rule-2)}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bar i{display:block;width:100%;max-width:26px;border-radius:3px 3px 0 0;background:var(--brand-2)}
.bar.now i{background:var(--gold)}
.bar.future i,.bar.zero i{background:var(--rule-2)}
.bar b{font-size:11px;font-weight:600;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar-x{display:grid;grid-template-columns:repeat(var(--cols,12),minmax(0,1fr));gap:6px;margin-top:6px;font-size:11.5px;color:var(--ink-3);text-align:center}
.bar-x .now{color:var(--ink);font-weight:600}
.bar-x .ms{display:none}
.hbars{display:flex;flex-direction:column;gap:12px;padding:14px 16px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13.5px}
.hbar .trk{grid-column:1/-1;height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.hbar .trk i{display:block;height:100%;background:var(--s1);border-start-end-radius:3px;border-end-end-radius:3px}
.hbar b{font-variant-numeric:tabular-nums;font-weight:600}

/* controls */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 220px;min-width:0}
input,select,textarea{background:var(--paper);border:1px solid var(--rule-2);border-radius:var(--r);padding:8px 10px;font-size:16px;min-height:40px;max-width:100%}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
input[disabled],select[disabled],textarea[disabled]{opacity:.6}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:7px 14px;border-radius:var(--r);border:1px solid var(--rule-2);background:var(--paper);color:var(--ink);font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--wash)}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.primary:hover{background:var(--btn);opacity:.9}
.btn.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--wash)}
.btn.danger{color:var(--bad)}
.btn.armed,.btn.armed:hover{background:var(--bad);border-color:var(--bad);color:var(--on-bad)}
.btn.sm{min-height:32px;padding:3px 10px;font-size:13px}
.btn.icon{padding:0;width:40px}
.btn[disabled]{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:var(--r);overflow:hidden;flex:none}
.seg button{border:0;background:var(--paper);color:var(--ink-2);padding:6px 12px;font-size:13.5px;font-weight:500;cursor:pointer;min-height:36px}
.seg button+button{border-inline-start:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg.att button[aria-pressed="true"]{font-weight:600;box-shadow:inset 0 -2px 0 currentColor}
.seg.att button.p[aria-pressed="true"]{background:var(--ok-soft);color:var(--ok)}
.seg.att button.l[aria-pressed="true"]{background:var(--warn-soft);color:var(--warn)}
.seg.att button.a[aria-pressed="true"]{background:var(--bad-soft);color:var(--bad)}
.seg.att button.v[aria-pressed="true"]{background:var(--gold-soft);color:var(--gold)}
.seg button[disabled]{cursor:default}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fchip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink-2);font-size:13.5px;font-weight:500;cursor:pointer;min-height:34px;white-space:nowrap}
.fchip span{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:12px}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.fchip[aria-pressed="true"] span{color:inherit;opacity:.75}

/* tables */
.table-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r);-webkit-overflow-scrolling:touch}
.table-wrap.flush{border:0;border-radius:0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:start;font-weight:500;color:var(--ink-3);font-size:12.5px;padding:9px 12px;border-bottom:1px solid var(--rule-2);background:var(--wash);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--wash)}
.tbl.compact td,.tbl.compact th{padding:7px 12px}
.c-name{font-weight:500}
.c-sub{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.hide-md{}
@media (max-width:1000px){.hide-md{display:none}}
.row-acts{white-space:nowrap;text-align:end}
tr.voided td{color:var(--ink-3)}
tr.voided td.num{text-decoration:line-through}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--wash);color:var(--ink-2);line-height:1.6}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.chip.neutral{background:var(--wash);color:var(--ink-2)}
.tag{display:inline-block;margin-inline-start:6px;padding:0 6px;border:1px dashed var(--rule-2);border-radius:4px;font-size:11px;font-weight:500;color:var(--ink-3);vertical-align:1px;line-height:1.6}

/* attendance */
.datebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.date-long{font-weight:500;margin-inline-start:4px}
.tally{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;font-size:13.5px;color:var(--ink-2)}
.tally b{color:var(--ink);font-variant-numeric:tabular-nums;margin-inline-start:2px}
.tally .btn{margin-inline-start:auto}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;vertical-align:1px}
.dot.p{background:var(--ok)} .dot.l{background:var(--warn)} .dot.a{background:var(--bad)} .dot.v{background:var(--gold)} .dot.none{background:var(--rule-2)}
.att-list{border:1px solid var(--rule);border-radius:var(--r)}
.att-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;border-bottom:1px solid var(--rule)}
.att-row:last-child{border-bottom:0}
.att-who{flex:1 1 200px;min-width:0}
.time{width:120px;min-height:36px;padding:5px 8px}
.foot-note{font-size:12.5px;color:var(--ink-3)}

/* requests, stats */
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) 340px;align-items:start}
@media (max-width:920px){.split{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.req{border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.req-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.req-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:14px}
.req-note{font-size:14px;color:var(--ink-2)}
.req-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;padding:12px 16px;border:1px solid var(--rule);border-radius:var(--r)}
.stat-l{font-size:12.5px;color:var(--ink-3)}
.stat-v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.stat.bad .stat-v{color:var(--bad)}
.sum3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sum3 .stat{border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;min-width:0}
.sum3 .stat-v{font-size:16px;overflow-wrap:anywhere}

  rm_staff:['صف واحد لكل موظف، والاسم هو الحقل الإلزامي الوحيد.','الرقم الوظيفي: يُستخدم لمطابقة الموظفين المسجلين في النظام، وعند عدم وجوده تتم المطابقة بالاسم مطابقة تامة.','القسم: التدريس أو الإدارة أو الخدمات المساندة أو النقل أو أخرى.','التواريخ: استخدم خلية تاريخ، أو اكتبها بالصيغة 2026-09-01 أو 01/09/2026 (اليوم أولًا). لا تُقبل التواريخ الهجرية.','الحالة: على رأس العمل أو غير نشط، والخلية الفارغة تعني على رأس العمل.','أعمدة الراتب مبالغ شهرية، ولا يستوردها إلا المحررون.','الخلايا الفارغة لا تمحو أي بيانات مسجلة.'],
  rm_fees:['ورقة الطلاب: صف لكل طالب، والاسم والصف إلزاميان.','الصف: KG1 إلى KG3 أو 1 إلى 12، أو اسم الصف كما يظهر في النظام.','ورقة الرسوم: المبالغ المستحقة، والبيان والمبلغ وتاريخ الاستحقاق إلزامية. لترحيل رصيد من نظام سابق أضف رسمًا بيانه «رصيد سابق».','ورقة الدفعات: المبالغ المستلمة، والمبلغ والتاريخ إلزاميان. طريقة الدفع: نقدًا أو بطاقة مدى أو تحويل بنكي أو سداد أو شيك.','تُربط الرسوم والدفعات بالطالب عن طريق رقمه، أو اسمه مطابقًا عند عدم وجود الرقم.','التواريخ: استخدم خلية تاريخ، أو اكتبها بالصيغة 2026-09-01 أو 01/09/2026 (اليوم أولًا). لا تُقبل التواريخ الهجرية.','تُستبعد الصفوف المسجلة مسبقًا، لذا لا ينشئ استيراد الملف نفسه مرتين سجلات مكررة.','الخلايا الفارغة لا تمحو أي بيانات مسجلة.'],

function leaveStatus(l){const a=S.D.appr.get('leave-'+l.id);return a?a.decision:'pending';}

function ptotal(p){return r2(num(p.qty)*num(p.unit));}
function payOf(id){const p=S.D.pay.get(id);if(!p)return null;return r2(num(p.basic)+num(p.housing)+num(p.transport)+num(p.other));}
function annualTaken(sid){const c=cfg();return sum(S.D.apprLeaves.filter(l=>l.staffId===sid&&l.type==='annual'&&l.from>=c.yearStart&&l.from<=c.yearEnd),l=>num(l.days)||workdays(l.from,l.to));}
function leaveLeft(s){if(s.annualLeave==null||s.annualLeave==='')return null;return num(s.annualLeave)-annualTaken(s.id);}
function monthDays(ym){const p=ym.split('-').map(Number),out=[],today=todayISO();const d=new Date(p[0],p[1]-1,1);while(d.getMonth()===p[1]-1){const iso=isoOf(d);if(iso>today)break;if(isWorkday(iso))out.push(iso);d.setDate(d.getDate()+1);}return out;}
function attCode(sid,d){const doc=S.D.att.get(d);let st=(doc&&doc.records&&doc.records[sid]&&doc.records[sid].s)||null;if(!st&&onLeave(sid,d))st='v';return st;}
function monthRows(staff,ym){
  const days=monthDays(ym);
  return {days,rows:staff.map(s=>{const c={p:0,l:0,a:0,v:0,none:0};days.forEach(d=>{if(s.hireDate&&s.hireDate>d)return;c[attCode(s.id,d)||'none']++;});const base=c.p+c.l+c.a;c.rate=base?Math.round((c.p+c.l)/base*100):null;return{s,c};})};
}
function hasSample(){return COLS.some(c=>S.data[c].some(d=>d.sample));}
function sampleDocs(){const out=[];COLS.forEach(c=>S.data[c].forEach(d=>{if(d.sample)out.push(c+'/'+d.id);}));return out;}
function suggestAmt(sid){const L=S.D.ledger.get(sid);if(!L)return '';if(L.overdue>0)return L.overdue;if(L.next)return L.next.rem;return L.balance>0?L.balance:'';}
function feeRows(){
  const q=S.ui.feeQ.trim().toLowerCase(),g=S.ui.feeGrade,f=S.ui.feeFilter;
  return S.data.students.slice().sort(byName).filter(s=>{if(g!=='all'&&s.grade!==g)return false;const L=S.D.ledger.get(s.id);if(f==='overdue'&&L.status!=='overdue')return false;if(f==='owing'&&L.status!=='owing')return false;if(f==='paid'&&!(L.status==='paidup'||L.status==='credit'))return false;if(q&&![s.name,s.guardian,s.guardianPhone,s.studentNo].some(v=>String(v||'').toLowerCase().indexOf(q)>-1))return false;return true;});
}
function feeFilterDesc(){const p=[];if(S.ui.feeFilter!=='all')p.push(t('ff_'+S.ui.feeFilter));if(S.ui.feeGrade!=='all')p.push(gradeLabel(S.ui.feeGrade));if(S.ui.feeQ.trim())p.push('«'+S.ui.feeQ.trim()+'»');return p.join(' · ');}

/* ---------- html helpers ---------- */
function head(title,sub,acts,tools){return `<div class="page-head"><div class="ph-title"><h1>${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div>${tools?`<div class="ph-tools">${tools}</div>`:''}${acts?`<div class="ph-actions">${acts}</div>`:''}</div>`;}
const IMPORTABLE={staff:'staff',fees:'fees'};
function toolBtns(v){let h='';if(IMPORTABLE[v]&&can(IMPORTABLE[v]==='staff'?'staff.import':'fees.import'))h+=`<button class="btn tool" type="button" data-act="import-open" data-k="${IMPORTABLE[v]}" aria-label="${esc(t('import'))}" title="${esc(t('import'))}">${icon('upload')}<span>${t('import')}</span></button>`;if(EXP[v]&&S.dl&&ready()&&has('export'))h+=`<button class="btn tool" type="button" data-act="export-open" aria-label="${esc(t('export'))}" title="${esc(t('export'))}">${icon('download')}<span>${t('export')}</span></button>`;return h;}
function notice(kind,html){return `<div class="notice ${kind||''}" role="status">${html}</div>`;}
function panel(title,meta,body,foot){return `<section class="panel"><div class="panel-h"><h2>${title}</h2>${meta||''}</div><div class="panel-b">${body}</div>${foot||''}</section>`;}
function emptyBox(msg,cta){return `<div class="empty"><p>${msg}</p>${cta?`<div class="btn-row">${cta}</div>`:''}</div>`;}
function stat(l,v,cls){return `<div class="stat ${cls||''}"><div class="stat-l">${l}</div><div class="stat-v">${v}</div></div>`;}
function dlr(k,v){return `<div><dt>${k}</dt><dd>${v}</dd></div>`;}
function tag(r){return r&&r.sample?`<span class="tag">${t('sample')}</span>`:'';}
function chip(cls,text){return `<span class="chip ${cls}">${text}</span>`;}
function sel(id,opts,val,extra){return `<select id="${id}" name="${id}" ${extra||''}>${opts.map(o=>`<option value="${esc(o[0])}"${String(o[0])===String(val)?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`;}
function inp(id,val,type,extra){return `<input id="${id}" name="${id}" type="${type||'text'}" value="${esc(val==null?'':val)}" ${extra||''}>`;}
function fld(id,label,control,o){o=o||{};return `<div class="field${o.span?' span2':''}"><label for="${id}">${label}${o.req?' <span class="req">*</span>':''}</label>${control}${o.hint?`<p class="hint">${o.hint}</p>`:''}</div>`;}
function filters(act,items,curv){return `<div class="filters" role="group">${items.map(i=>`<button class="fchip" type="button" data-act="${act}" data-f="${i[0]}" aria-pressed="${curv===i[0]}">${i[1]}${i[2]!=null?`<span>${i[2]}</span>`:''}</button>`).join('')}</div>`;}
function statusChip(s){const m={p:'ok',l:'warn',a:'bad',v:'gold'};return s?chip(m[s],t(s==='v'?'s_vLong':'s_'+s)):chip('neutral',t('s_none'));}
function feeChip(L){const m={overdue:['bad','fs_overdue'],owing:['gold','fs_owing'],paidup:['ok','fs_paidup'],credit:['ok','fs_credit'],nobill:['neutral','fs_nobill']}[L.status];return chip(m[0],t(m[1]));}
function purChip(st){const m={pending:'warn',approved:'gold',ordered:'gold',received:'ok',rejected:'bad'}[st];return chip(m,t('ps_'+st));}
function leaveChip(st){return st==='approved'?chip('ok',t('f_approved')):st==='rejected'?chip('bad',t('f_rejected')):chip('warn',t('f_pending'));}
function decideBtns(kind,id){if(!can(kind==='leave'?'leave.approve':'pur.approve'))return `<span class="muted sm">${t('editorsDecide')}</span>`;return `<span class="btns"><button class="btn sm ok" type="button" data-act="approve" data-k="${kind}" data-id="${id}">${t('approve')}</button><button class="btn sm" type="button" data-act="reject" data-k="${kind}" data-id="${id}">${t('reject')}</button></span>`;}
function delBtn(col,id,keep){return `<button type="button" class="btn sm ghost danger" data-act="del" data-col="${col}" data-id="${id}"${keep?' data-keep="1"':''}>${t('delete')}</button>`;}
function banners(){
  let o='';
  if(S.store==='loading'||(S.store==='live'&&!ready()))o+=notice('',t('loading'));
  else if(S.store==='off')o+=notice('warn',t('offline'));
  else if(S.canWrite===false)o+=notice('warn',t('viewOnly'));
  if(typeof demoBar==='function')o=demoBar()+o;
  if(hasSample()&&has('setup'))o+=notice('gold',esc(t('sampleOn'))+(S.view!=='setup'&&has('setup')?` <button class="link" type="button" data-act="go" data-v="setup">${t('clearInSetup')}</button>`:''));
  return o;
}

const V={};
V.overview=function(){
  const c=cfg(),today=todayISO(),F=S.D.fees,A=dayStatus(today),work=isWorkday(today);
  const fv=has('fees.view'),av=has('att.view'),lv=has('leave.view'),pv=has('pur.view');
  const pendL=lv?S.data.leaves.filter(l=>leaveStatus(l)==='pending').sort((a,b)=>String(a.from).localeCompare(String(b.from))):[];
  const pendP=pv?S.data.purchases.filter(p=>purchaseStatus(p)==='pending').sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt))):[];
  let h=head(t('ov_title'),esc(t('yearLbl')+' '+c.yearLabel))+banners();
  if(ready()&&S.role==='admin'&&!S.data.staff.length&&!S.data.students.length)h+=getStarted();
  const pct=F.billed?Math.round(F.paid/F.billed*100):0;
  const tiles=[];
  if(fv)tiles.push(
    `<div class="kpi"><div class="kpi-l">${t('feesCollected')}</div><div class="kpi-v">${money(F.paid)}</div><div class="meter"><i style="width:${Math.min(100,pct)}%"></i></div><div class="kpi-s">${t('ofBilled',money(F.billed),pct)}</div></div>`,
    `<div class="kpi"><div class="kpi-l">${t('outstanding')}</div><div class="kpi-v">${money(F.outstanding)}</div><div class="kpi-s${F.overdueAmt>0?' bad':''}">${F.overdueAmt>0?t('overdueAcross',money(F.overdueAmt),F.overdueCount):t('nothingOverdue')}</div></div>`);
  if(av)tiles.push(
    `<div class="kpi"><div class="kpi-l">${t('staffToday')}</div><div class="kpi-v">${work?t('ofStaff',A.p+A.l,A.total):t('weekend')}</div><div class="kpi-s">${work&&A.total?t('staffTodaySub',A.l,A.a,A.v,A.none):''}</div></div>`);
  if(lv||pv)tiles.push(
    `<div class="kpi"><div class="kpi-l">${t('awaiting')}</div><div class="kpi-v">${pendL.length+pendP.length}</div><div class="kpi-s">${t('awaitingSub',pendL.length,pendP.length)}</div></div>`);
  if(can('pay.view')){const act=S.data.staff.filter(s=>s.status!=='inactive');tiles.push(`<div class="kpi"><div class="kpi-l">${t('payrollMonthly')}</div><div class="kpi-v">${money(sum(act,s=>payOf(s.id)||0))}</div><div class="kpi-s">${t('payrollSub',act.length)}</div></div>`);}
  if(tiles.length)h+=`<div class="kpis" style="--n:${tiles.length}">${tiles.join('')}</div>`;
  h+=`<div class="grid2">${fv?pOverdue():''}${lv||pv?pPending(pendL,pendP):''}${fv?pCollections():''}${av?pToday(A,work):''}</div>`;
  return h;
};
function getStarted(){
  const w=canWrite();
  const steps=[['gs1','gs1d','add-staff','addStaff','staff'],['gs2','gs2d','add-student','addStudent','fees'],['gs3','gs3d','bill','billGrade','']];
  return `<section class="panel"><div class="panel-h"><h2>${t('getStarted')}</h2></div><ol class="steps">${steps.map(s=>`<li><div><div class="step-t">${t(s[0])}</div><p>${t(s[1])}</p></div>${w?`<span class="btns">${s[4]?`<button class="btn sm" type="button" data-act="import-open" data-k="${s[4]}">${icon('upload')}${t('import')}</button>`:''}<button class="btn sm" type="button" data-act="${s[2]}">${t(s[3])}</button></span>`:''}</li>`).join('')}</ol>${can('sample')?`<div class="start-sample"><p>${t('sampleNote')}</p><button class="btn" type="button" data-act="sample-load"${S.busy?' disabled':''}>${t('trySample')}</button></div>`:''}</section>`;
}
function pOverdue(){
  const rows=S.data.students.map(s=>({s,L:S.D.ledger.get(s.id)})).filter(x=>x.L&&x.L.overdue>0.004).sort((a,b)=>b.L.overdue-a.L.overdue);
  const body=rows.length?`<ul class="list">${rows.slice(0,6).map(x=>`<li><button class="li-main" type="button" data-act="open-student" data-id="${x.s.id}"><span class="li-t">${esc(x.s.name)}${tag(x.s)}</span><span class="li-s">${esc(gradeLabel(x.s.grade))} · ${t('since',fShort(x.L.oldest))}</span></button><span class="li-v bad">${money(x.L.overdue)}</span></li>`).join('')}</ul>`:`<p class="empty-sm">${t('nothingOverdue')}</p>`;
  const foot=rows.length>6?`<div class="panel-f"><button class="link" type="button" data-act="fee-overdue">${t('seeAllOverdue',rows.length)}</button></div>`:'';
  return panel(t('overdueFees'),rows.length?`<span class="ph-meta">${money(S.D.fees.overdueAmt)}</span>`:'',body,foot);
}
function reqLeaveLi(l){const s=staffById(l.staffId);return `<li class="li-wrap"><div class="li-main static"><span class="li-t">${esc(s?s.name:t('removedStaff'))}${tag(l)}</span><span class="li-s">${t('lt_'+l.type)} · ${fRange(l.from,l.to)} · ${t('schoolDays',num(l.days))}</span></div>${decideBtns('leave',l.id)}</li>`;}
function reqPurLi(p){return `<li class="li-wrap"><div class="li-main static"><span class="li-t">${esc(p.item)} × ${n0(p.qty)}${tag(p)}</span><span class="li-s">${money(ptotal(p))} · ${t('cat_'+(p.category||'other'))}</span></div>${decideBtns('purchase',p.id)}</li>`;}
function pPending(pl,pp){
  const items=pl.map(reqLeaveLi).concat(pp.map(reqPurLi));
  return panel(t('pendingReqs'),items.length?`<span class="ph-meta">${items.length}</span>`:'',items.length?`<ul class="list">${items.slice(0,8).join('')}</ul>`:`<p class="empty-sm">${t('noneWaiting')}</p>`);
}
function pCollections(){
  const c=cfg(),months=[],d=parseISO(c.yearStart);d.setDate(1);const end=parseISO(c.yearEnd);
  for(let i=0;i<12&&d<=end;i++){months.push(d.getFullYear()+'-'+pad(d.getMonth()+1));d.setMonth(d.getMonth()+1);}
  const tot={};S.data.payments.forEach(p=>{if(p.voided)return;const m=String(p.date||'').slice(0,7);tot[m]=(tot[m]||0)+num(p.amount);});
  const cm=todayISO().slice(0,7),vals=months.map(m=>tot[m]||0),max=Math.max(0,...vals),peak=max>0?vals.indexOf(max):-1;
  const bars=months.map((m,i)=>{const v=vals[i];const fut=m>cm;const hgt=fut||!v?2:Math.max(3,Math.round(v/max*112));const cls=m===cm?'now':fut?'future':!v?'zero':'';const lab=v>0&&(i===peak||m===cm)?`<b>${moneyK(v)}</b>`:'';return `<div class="bar ${cls}" title="${esc(fMonth(m,{month:'long',year:'numeric'})+': '+money(v))}">${lab}<i style="height:${hgt}px"></i></div>`;}).join('');
  const labels=months.map(m=>{const p=m.split('-').map(Number);const small=S.lang==='ar'?String(p[1]):fMonth(m,{month:'narrow'});return `<span class="${m===cm?'now':''}"><span class="ml">${esc(fMonth(m,{month:'short'}))}</span><span class="ms">${esc(small)}</span></span>`;}).join('');
  return panel(t('collections'),`<span class="ph-meta">${money(sum(vals,v=>v))}</span>`,`<div class="chart" style="--cols:${months.length}"><div class="bars">${bars}</div><div class="bar-x">${labels}</div></div>`);
}
function pToday(A,work){
  if(!work)return panel(t('today'),'',`<p class="empty-sm">${t('noWorkToday')}</p>`);
  if(!A.total)return panel(t('today'),'',`<p class="empty-sm">${t('noActiveStaff')}</p>`);
  const out=activeStaff().filter(s=>['l','a','v'].indexOf(A.map[s.id])>-1);
  let body=A.none?`<div class="today-cta"><span>${t('notMarked',A.none)}</span>${can('att.write')?`<button class="btn sm primary" type="button" data-act="go-att-today">${t('markAttendance')}</button>`:''}</div>`:`<p class="empty-sm ok-t">${t('allMarked')}</p>`;
  if(out.length)body+=`<ul class="list">${out.map(s=>`<li><div class="li-main static"><span class="li-t">${esc(s.name)}</span><span class="li-s">${esc(s.title||'')}</span></div>${statusChip(A.map[s.id])}</li>`).join('')}</ul>`;
  return panel(t('today'),`<span class="ph-meta">${t('ofStaff',A.p+A.l,A.total)}</span>`,body);
}

function stmtEvents(L){return L.lines.map(d=>({k:'d',date:d.dueDate||'',o:d})).concat(L.all.map(p=>({k:'p',date:p.date||'',o:p}))).sort((a,b)=>a.date.localeCompare(b.date)||(a.k===b.k?0:a.k==='d'?-1:1));}
function statement(L){
  const ev=stmtEvents(L);
  if(!ev.length)return `<p class="empty-sm">${t('noStatement')}</p>`;
  let run=0;const adm=can('delete'),vd=can('fees.void');const cm={paid:['ok','ds_paid'],overdue:['bad','ds_overdue'],open:['gold','ds_open']};
  if(S.mob){
    return `<ul class="list boxed">${ev.map(e=>{
      if(e.k==='d'){const d=e.o;run=r2(run+num(d.amount));const c=cm[d.st];
        return `<li class="li-wrap"><div class="li-main static"><span class="li-t">${esc(d.desc||'')}${tag(d)}</span><span class="li-s">${fShort(d.dueDate)} · ${chip(c[0],t(c[1]))}</span></div><div class="li-end"><span class="li-v">${money(d.amount)}</span><span class="li-s">${t('col_running')} ${money(run)}</span></div>${adm?`<div class="li-acts">${delBtn('dues',d.id,1)}</div>`:''}</li>`;}
      const p=e.o;if(!p.voided)run=r2(run-num(p.amount));
      return `<li class="li-wrap${p.voided?' voided':''}"><button class="li-main" type="button" data-act="receipt" data-id="${p.id}"><span class="li-t">${t('paymentWord')} · ${t('pm_'+(p.method||'cash'))}${tag(p)}</span><span class="li-s">${fShort(p.date)} · <span class="mono">${esc(p.receiptNo||'')}</span>${p.voided?` · <span class="bad-t">${t('voided')}</span>`:''}</span></button><div class="li-end"><span class="li-v ok-t">${money(p.amount)}</span><span class="li-s">${t('col_running')} ${money(run)}</span></div>${vd&&!p.voided?`<div class="li-acts"><button class="btn sm ghost danger" type="button" data-act="void" data-id="${p.id}">${t('void')}</button></div>`:''}</li>`;
    }).join('')}</ul>`;
  }
  const rows=ev.map(e=>{
    if(e.k==='d'){const d=e.o;run=r2(run+num(d.amount));const c=cm[d.st];
      return `<tr><td class="nowrap">${fShort(d.dueDate)}</td><td><div>${esc(d.desc||'')}${tag(d)}</div><div class="c-sub">${chip(c[0],t(c[1]))}${d.st!=='paid'&&d.rem<num(d.amount)?` <span class="muted">${t('remainingAmt',money(d.rem))}</span>`:''}</div></td><td class="num">${money(d.amount)}</td><td class="num"></td><td class="num">${money(run)}</td><td class="row-acts">${adm?delBtn('dues',d.id,1):''}</td></tr>`;}
    const p=e.o;if(!p.voided)run=r2(run-num(p.amount));
    return `<tr class="${p.voided?'voided':''}"><td class="nowrap">${fShort(p.date)}</td><td><div>${t('paymentWord')} · ${t('pm_'+(p.method||'cash'))}${tag(p)}</div><div class="c-sub"><button class="link mono" type="button" data-act="receipt" data-id="${p.id}">${esc(p.receiptNo||'')}</button>${p.ref?` · <span dir="ltr">${esc(p.ref)}</span>`:''}${p.voided?` · <span class="bad-t">${t('voided')}</span>`:''}</div></td><td class="num"></td><td class="num">${money(p.amount)}</td><td class="num">${money(run)}</td><td class="row-acts">${vd&&!p.voided?`<button class="btn sm ghost danger" type="button" data-act="void" data-id="${p.id}">${t('void')}</button>`:''}</td></tr>`;
  }).join('');
  return `<div class="table-wrap"><table class="tbl"><thead><tr><th>${t('col_date')}</th><th>${t('col_item')}</th><th class="num">${t('col_charge')}</th><th class="num">${t('col_payment')}</th><th class="num">${t('col_running')}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

const wq={},attMade=new Set();
function queue(path,fn){const p=(wq[path]||Promise.resolve()).catch(()=>{}).then(fn);wq[path]=p;return p;}
async function attempt(fn){let d=700;for(let i=0;;i++){try{return await fn();}catch(e){const c=e&&e.code;if(c==='unavailable'&&i<1){await sleep(400+Math.random()*700);continue;}if(c==='resource_exhausted'&&i<4){await sleep(d+Math.random()*400);d*=2;continue;}throw e;}}}
function needDb(){if(!S.db)throw {code:'off'};}
function dbSet(path,data){needDb();return queue(path,()=>attempt(()=>S.db.doc(path).set(data)));}
function dbUpdate(path,data){needDb();return queue(path,()=>attempt(()=>S.db.doc(path).update(data)));}
function dbDelete(path){needDb();return queue(path,()=>attempt(()=>S.db.doc(path).delete()));}
function newId(col){return S.db.collection(col).doc().id;}
function stamp(isNew){const o={updatedBy:S.uid,updatedAt:nowISO()};if(isNew){o.createdBy=S.uid;o.createdAt=o.updatedAt;}return o;}
function errMsg(e){const c=e&&e.code;if(c==='partial')return t('e_partial',e.failed);if(c==='invalid_argument'||c==='not_granted')return t('e_denied');if(c==='quota_exceeded')return t('e_quota');if(c==='resource_exhausted')return t('e_busy');if(c==='off'||c==='revoked')return t('e_off');return t('e_generic');}
async function withSave(fn,ok){if(S.store!=='live'){toast(t('e_off'),'bad');return false;}try{await fn();if(ok)toast(ok);return true;}catch(e){console.warn(e);toast(errMsg(e),'bad');return false;}}
function attWrite(date,records){
  needDb();const path='attendance/'+date;
  return queue(path,()=>attempt(async()=>{const meta={updatedBy:S.uid,updatedAt:nowISO()},ref=S.db.doc(path);
    if(S.D.att.has(date)||attMade.has(date)){await ref.update(Object.assign({records},meta));return;}
    let got={acquired:false};try{for(let i=0;i<12;i++){got=await ref.acquire({holder:S.uid||'page',ttlMs:6000});if(got.acquired)break;await sleep(300+Math.random()*400);}}catch(e){}
    const snap=await ref.get();
    if(snap.exists&&snap.data()&&snap.data().records)await ref.update(Object.assign({records},meta));
    else await ref.set(Object.assign({date,records},meta));
    attMade.add(date);}));
}
function lateThreshold(){const c=cfg();const p=c.dayStart.split(':').map(Number);const m=(p[0]||0)*60+(p[1]||0)+num(c.grace);return pad(Math.floor(m/60)%24)+':'+pad(m%60);}
async function pool(fns,n,onDone){
  let i=0,fatal=null,failed=0;
  async function worker(){while(i<fns.length&&!fatal){const f=fns[i++];try{await f();}catch(e){failed++;if(e&&['quota_exceeded','invalid_argument','off','revoked','not_granted'].indexOf(e.code)>-1)fatal=e;}if(onDone)onDone();}}
  await Promise.all(Array.from({length:Math.min(n,fns.length)},worker));
  if(fatal)throw fatal;if(failed)throw {code:'partial',failed};
}

async function doDelete(col,id,keep){
  const fz=['staff','students','leaves','purchases','payments'].indexOf(col)>-1?filesOf(col==='staff'?'staff':col,id).slice():[];
  const ok=await withSave(async()=>{
    if(col==='students'){for(const d of S.data.dues.filter(x=>x.studentId===id))await dbDelete('dues/'+d.id);}
    await dbDelete(col+'/'+id);
    if(col==='staff'&&S.D.pay.has(id))await dbDelete('payroll/'+id);
    if(col==='leaves'&&S.D.appr.has('leave-'+id)&&S.isAdmin)await dbDelete('approvals/leave-'+id);
    if(col==='purchases'&&S.D.appr.has('purchase-'+id)&&S.isAdmin)await dbDelete('approvals/purchase-'+id);
    if(col==='staff'&&S.D.sdocs.has(id))await dbDelete('staffdocs/'+id);
  },t('deleted'));
  if(ok&&S.assets)for(const f of fz){try{await S.assets.delete(f.id);}catch(e){}}
  if(ok&&!keep&&S.sheet&&!S.sheet.live)closeSheet();
  if(ok&&col==='students')closeSheet();
}

let xlsxP=null;
function xlsxLib(){
  if(window.ExcelJS)return Promise.resolve(window.ExcelJS);
  if(xlsxP)return xlsxP;
  xlsxP=(async()=>{for(const u of EXCELJS_URLS){try{await new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.async=true;s.onload=res;s.onerror=rej;(document.head||document.documentElement).appendChild(s);});if(window.ExcelJS)return window.ExcelJS;}catch(e){}}xlsxP=null;throw {code:'lib'};})();
  return xlsxP;
}

/* ---------- import: parsing ---------- */
function toLatin(s){return String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));}
function normKey(s){return toLatin(String(s==null?'':s)).toLowerCase().replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[^a-z0-9ء-ي]/g,'');}
function cellVal(v){
  if(v==null)return '';
  if(v instanceof Date)return v;
  if(typeof v==='object'){if('result' in v)return cellVal(v.result);if(Array.isArray(v.richText))return v.richText.map(r=>r.text).join('');if('text' in v)return cellVal(v.text);return '';}
  return v;
}
function isoUTC(d){return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());}
function validYMD(y,m,d){if(m<1||m>12||d<1||d>31||y<1900||y>2200)return null;const dt=new Date(y,m-1,d);if(dt.getMonth()!==m-1)return null;return y+'-'+pad(m)+'-'+pad(d);}
function parseDate(v){
  if(v==null||v==='')return '';
  if(v instanceof Date){if(isNaN(v))return null;return isoUTC(v);}
  if(typeof v==='number'){if(v>20000&&v<80000)return isoUTC(new Date(Math.round((v-25569)*86400000)));return null;}
  const s=toLatin(String(v)).trim();let m;
  if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)))return validYMD(+m[1],+m[2],+m[3]);
  if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/))){let y=+m[3];if(y<100)y+=2000;return validYMD(y,+m[2],+m[1]);}
  if(/^\d+(\.\d+)?$/.test(s))return parseDate(Number(s));
  const tm=Date.parse(s);if(!isNaN(tm)){const d=new Date(tm);return validYMD(d.getFullYear(),d.getMonth()+1,d.getDate());}
  return null;
}
function parseNum(v){if(typeof v==='number')return isFinite(v)?v:NaN;let s=toLatin(String(v)).replace(/٬/g,'').replace(/٫/g,'.').replace(/[,\s]/g,'').replace(/[^0-9.\-]/g,'').replace(/^\.+|\.+$/g,'');if(!s||s==='-')return NaN;return parseFloat(s);}
function parsePhone(v){if(v==null||v==='')return '';let s=typeof v==='number'?String(Math.round(v)):toLatin(String(v)).trim();s=s.replace(/[^\d+]/g,'');if(/^5\d{8}$/.test(s))s='0'+s;if(/^9665\d{8}$/.test(s))s='+'+s;return s;}
function mkAl(o){const m={};Object.keys(o).forEach(k=>{m[k]=o[k].map(normKey);});return m;}
const DEPT_AL=mkAl({teaching:['teaching','teacher','teachers','academic','faculty','التدريس','تدريس','معلم','معلمة','المعلمين','المعلمات','تعليمي','أكاديمي'],admin:['admin','administration','administrative','management','office','الإدارة','إدارة','إداري','إدارية'],support:['support','support services','services','facilities','maintenance','cleaning','الخدمات المساندة','الخدمات','خدمات','مساندة'],transport:['transport','transportation','drivers','driver','bus','النقل','نقل','السائقين','سائق','المواصلات'],other:['other','أخرى','اخرى']});

function splitBi(v){const parts=String(v).split(/\s+[\/|]\s+|\s+[–-]\s+/).map(x=>x.trim()).filter(Boolean);return parts.length>1?parts:null;}
function matchAl(v,AL){const sp=splitBi(v);if(sp){for(const x of sp){const r=matchAl(x,AL);if(r)return r;}return null;}const k=normKey(v);if(!k)return null;for(const key in AL){if(AL[key].indexOf(k)>-1||normKey(key)===k)return key;}
  for(const key in AL){for(const L of ['en','ar']){const x=I18N[L]['dept_'+key]||I18N[L]['pm_'+key]||I18N[L][key==='active'?'st_active':key==='inactive'?'st_inactive':key];if(x&&typeof x==='string'&&normKey(x)===k)return key;}}return null;}
function parseGrade(v){
  const sp=splitBi(v);if(sp){for(const x of sp){const r=parseGrade(x);if(r)return r;}return null;}
  const k=normKey(v);if(!k)return null;
  for(const g of GRADES){if(normKey(g)===k||normKey(AR_GRADES[g])===k||normKey(g.indexOf('KG')===0?'KG '+g.slice(2):'Grade '+g.slice(1))===k)return g;}
  let m=k.match(/^(?:grade|g|class|year|الصف|صف)?(\d{1,2})(?:st|nd|rd|th)?$/);if(m){const n=+m[1];if(n>=1&&n<=12)return 'G'+n;}

  return null;
}

Object.keys(IMP).forEach(ty=>IMP[ty].fields.forEach(f=>{f._al=f.alias.concat([I18N.en[f.label],I18N.ar[f.label]]).map(normKey).filter(Boolean);}));
function matchHeader(row,fields){const map={};let score=0;(row||[]).forEach((h,ci)=>{const k=normKey(h);if(!k)return;const f=fields.find(x=>x._al.indexOf(k)>-1&&!(x.k in map));if(f){map[f.k]=ci;score++;}});return{map,score};}
function detectSheet(rows,types){
  let best=null;
  for(let r=0;r<Math.min(rows.length,12);r++){if(!rows[r])continue;
    for(const ty of ['staff','students','charges','payments']){const m=matchHeader(rows[r],IMP[ty].fields);const okReq=IMP[ty].fields.filter(f=>f.req).every(f=>f.k in m.map);const okStu=(ty==='charges'||ty==='payments')?('studentNo' in m.map||'studentName' in m.map):true;
      if(okReq&&okStu&&m.score>=2&&(!best||m.score>best.score))best={type:ty,row:r,map:m.map,score:m.score};}}
  if(!best||types.indexOf(best.type)<0)return null;
  const nx=rows[best.row+1];if(nx&&matchHeader(nx,IMP[best.type].fields).score>=Math.max(2,best.score-1))best.skip=1;
  return best;
}
function rowUsed(row,map){return !!row&&Object.keys(map).some(k=>{const v=row[map[k]];return v!=null&&String(v).trim()!=='';});}
function parseRow(row,map,fields){
  const data={},errors=[],warnings=[];
  fields.forEach(f=>{
    if(!(f.k in map))return;const v=row[map[f.k]];const lab=t(f.label);
    if(v==null||(typeof v==='string'&&!v.trim())){if(f.req)errors.push(t('e_req',lab));return;}
    switch(f.type){
      case 'money':case 'num':case 'pct':{let n=parseNum(v);if(!isFinite(n)||(f.type==='money'&&n<0)){errors.push(t('e_num',lab));return;}if(f.type==='pct'){if(n>0&&n<1&&typeof v==='number')n*=100;n=Math.min(100,Math.max(0,n));}data[f.k]=f.type==='money'?r2(n):n;break;}
      case 'date':{const d=parseDate(v);if(!d){errors.push(t('e_date',lab));return;}data[f.k]=d;break;}
      case 'phone':data[f.k]=parsePhone(v);break;
      case 'code':data[f.k]=v instanceof Date?isoUTC(v):String(typeof v==='number'?Math.round(v*1e6)/1e6:v).trim();break;
      case 'grade':{const g=parseGrade(v);if(!g){errors.push(t('e_grade',String(v)));return;}data[f.k]=g;break;}
      case 'dept':{const d=matchAl(v,DEPT_AL);if(!d)warnings.push(t('w_dept',String(v)));data[f.k]=d||'other';break;}
      case 'method':{const m=matchAl(v,METHOD_AL);if(!m)warnings.push(t('w_method',String(v)));data[f.k]=m||'cash';break;}
      case 'staffStatus':data[f.k]=matchAl(v,STAFF_ST_AL)||'active';break;
      case 'studentStatus':data[f.k]=matchAl(v,STU_ST_AL)||'enrolled';break;
      default:data[f.k]=(v instanceof Date?isoUTC(v):String(v)).trim();
    }
  });
  return{data,errors,warnings};
}
function diff(ex,v){const ch={};Object.keys(v).forEach(k=>{const a=ex[k],b=v[k];if(typeof b==='number'?num(a)!==b||a===''||a==null:String(a==null?'':a)!==String(b))ch[k]=b;});return ch;}
function parseCSV(s){
  const first=s.split(/\r?\n/,1)[0]||'';const dl=(first.split(';').length>first.split(',').length)?';':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<s.length;i++){const c=s[i];
    if(q){if(c==='"'){if(s[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===dl){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&s[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}
    else f+=c;}
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;
}
async function readFile(file){
  const name=(file.name||'').toLowerCase();
  if(/\.xls$/.test(name))throw {code:'xls'};
  if(/\.csv$/.test(name)||file.type==='text/csv'){const txt=await file.text();return [{name:file.name.replace(/\.csv$/i,''),rows:parseCSV(txt.replace(/^﻿/,''))}];}
  const EX=await xlsxLib();const wb=new EX.Workbook();
  try{await wb.xlsx.load(await file.arrayBuffer());}catch(e){throw {code:'read'};}
  return wb.worksheets.filter(ws=>ws.state!=='hidden'&&ws.state!=='veryHidden').map(ws=>{const rows=[];ws.eachRow({includeEmpty:false},(row,rn)=>{const v=row.values,arr=[];for(let i=1;i<v.length;i++)arr.push(cellVal(v[i]));rows[rn-1]=arr;});return{name:ws.name,rows};});
}

/* ---------- import: planning and writing ---------- */
function planStaff(sheets){
  const out={kind:'staff',items:[],issues:[],counts:{},rows:0,found:[],payIgnored:false};
  const cnt=out.counts.staff={new:0,upd:0,dup:0,bad:0};
  const byNo=new Map(),byNm=new Map();S.data.staff.forEach(s=>{if(s.staffNo)byNo.set(normKey(s.staffNo),s);byNm.set(normKey(s.name),s);});
  const seen=new Set(),adm=isAdm()&&can('pay.view'),F=IMP.staff.fields;
  sheets.forEach(sh=>{
    const d=detectSheet(sh.rows,['staff']);if(!d)return;out.found.push('staff');
    if(!adm&&F.some(f=>f.pay&&f.k in d.map))out.payIgnored=true;
    for(let r=d.row+1+(d.skip||0);r<sh.rows.length;r++){
      const row=sh.rows[r];if(!rowUsed(row,d.map))continue;out.rows++;
      const where=t('imp_row',sh.name,r+1),res=parseRow(row,d.map,F);
      if(res.errors.length){cnt.bad++;out.issues.push({lvl:'err',msg:where+': '+res.errors.join('; ')});continue;}
      res.warnings.forEach(w=>out.issues.push({lvl:'warn',msg:where+': '+w}));
      const v=res.data,pay={};F.forEach(f=>{if(f.pay&&f.k in v){if(adm)pay[f.k]=v[f.k];delete v[f.k];}});
      const key=v.staffNo?'n:'+normKey(v.staffNo):'m:'+normKey(v.name);
      if(seen.has(key)){cnt.bad++;out.issues.push({lvl:'err',msg:where+': '+t('e_dupFile')});continue;}seen.add(key);
      let ex=v.staffNo?byNo.get(normKey(v.staffNo)):null;
      if(!ex){const c=byNm.get(normKey(v.name));if(c&&(!v.staffNo||!c.staffNo))ex=c;}
      const hasPay=Object.keys(pay).length>0;
      if(ex&&ex.id){
        const ch=diff(ex,v),pch=hasPay?diff(S.D.pay.get(ex.id)||{},pay):{};
        if(!Object.keys(ch).length&&!Object.keys(pch).length){cnt.dup++;continue;}
        cnt.upd++;out.items.push({col:'staff',id:ex.id,isNew:false,data:ch,pay:Object.keys(pch).length?pch:null,payNew:!S.D.pay.has(ex.id)});
      }else{
        const id=newId('staff'),data=Object.assign({name:'',staffNo:'',title:'',dept:'other',phone:'',email:'',hireDate:'',annualLeave:null,status:'active',notes:''},v);
        cnt.new++;out.items.push({col:'staff',id,isNew:true,data,pay:hasPay?pay:null,payNew:true});
      }
    }
  });
  return out;
}
function planFees(sheets){
  const out={kind:'fees',items:[],issues:[],counts:{},rows:0,found:[]};
  const C=k=>out.counts[k]||(out.counts[k]={new:0,upd:0,dup:0,bad:0});
  const byNo=new Map(),byNm=new Map(),byNG=new Map(),exist=S.D.stu;
  const addIdx=s=>{if(s.studentNo)byNo.set(normKey(s.studentNo),s.id);const nk=normKey(s.name);if(!byNm.has(nk))byNm.set(nk,new Set());byNm.get(nk).add(s.id);byNG.set(nk+'|'+s.grade,s.id);};
  S.data.students.forEach(addIdx);
  const det=[];sheets.forEach(sh=>{const d=detectSheet(sh.rows,['students','charges','payments']);if(d)det.push(Object.assign({sh},d));});
  const order={students:0,charges:1,payments:2};det.sort((a,b)=>order[a.type]-order[b.type]);
  const seenStu=new Set();
  const dueKeys=new Set(S.data.dues.map(d=>d.studentId+'|'+normKey(d.desc)+'|'+d.dueDate+'|'+r2(num(d.amount))));
  const payKeys=new Set(S.data.payments.map(p=>p.studentId+'|'+p.date+'|'+r2(num(p.amount))+'|'+normKey(p.ref)));
  const rcpts=new Set(S.data.payments.map(p=>p.receiptNo).filter(Boolean));
  det.forEach(d=>{
    const ty=d.type,F=IMP[ty].fields,cnt=C(ty);if(out.found.indexOf(ty)<0)out.found.push(ty);
    for(let r=d.row+1+(d.skip||0);r<d.sh.rows.length;r++){
      const row=d.sh.rows[r];if(!rowUsed(row,d.map))continue;out.rows++;
      const where=t('imp_row',d.sh.name,r+1),res=parseRow(row,d.map,F);
      if(res.errors.length){cnt.bad++;out.issues.push({lvl:'err',msg:where+': '+res.errors.join('; ')});continue;}
      res.warnings.forEach(w=>out.issues.push({lvl:'warn',msg:where+': '+w}));
      const v=res.data;
      if(ty==='students'){
        const key=v.studentNo?'n:'+normKey(v.studentNo):'g:'+normKey(v.name)+'|'+v.grade;
        if(seenStu.has(key)){cnt.bad++;out.issues.push({lvl:'err',msg:where+': '+t('e_dupFile')});continue;}seenStu.add(key);
        let id=v.studentNo?byNo.get(normKey(v.studentNo)):byNG.get(normKey(v.name)+'|'+v.grade);
        if(!id&&v.studentNo){const c=byNG.get(normKey(v.name)+'|'+v.grade);if(c&&exist.get(c)&&!exist.get(c).studentNo)id=c;}
        if(id&&exist.has(id)){const ch=diff(exist.get(id),v);if(!Object.keys(ch).length){cnt.dup++;continue;}cnt.upd++;out.items.push({col:'students',id,isNew:false,data:ch});}
        else if(id){cnt.bad++;out.issues.push({lvl:'err',msg:where+': '+t('e_dupFile')});}
        else{id=newId('students');const data=Object.assign({name:'',grade:'',section:'',studentNo:'',status:'enrolled',guardian:'',guardianPhone:'',discountPct:0,notes:''},v);cnt.new++;out.items.push({col:'students',id,isNew:true,data});addIdx(Object.assign({id},data));}
        continue;
      }
      let sid=null;const label=v.studentNo||v.studentName||'';
      if(v.studentNo)sid=byNo.get(normKey(v.studentNo))||null;
      if(!sid&&v.studentName){const set=byNm.get(normKey(v.studentName));if(set&&set.size===1)sid=[...set][0];else if(set&&set.size>1){cnt.bad++;out.issues.push({lvl:'err',msg:where+': '+t('e_ambStudent',v.studentName)});continue;}}
      if(!sid){cnt.bad++;out.issues.push({lvl:'err',msg:where+': '+(label?t('e_noStudent',label):t('e_noStudentCol'))});continue;}
      if(ty==='charges'){
        const k=sid+'|'+normKey(v.desc)+'|'+v.dueDate+'|'+r2(v.amount);if(dueKeys.has(k)){cnt.dup++;continue;}dueKeys.add(k);
        cnt.new++;out.items.push({col:'dues',id:newId('dues'),isNew:true,data:{studentId:sid,desc:v.desc,amount:r2(v.amount),dueDate:v.dueDate}});
      }else{
        const k=sid+'|'+v.date+'|'+r2(v.amount)+'|'+normKey(v.ref||'');if((v.receiptNo&&rcpts.has(v.receiptNo))||payKeys.has(k)){cnt.dup++;continue;}
        payKeys.add(k);const rn=v.receiptNo||receiptNo(v.date);rcpts.add(rn);
        cnt.new++;out.items.push({col:'payments',id:newId('payments'),isNew:true,data:{studentId:sid,amount:r2(v.amount),date:v.date,method:v.method||'cash',ref:v.ref||'',note:v.note||'',receiptNo:rn}});
      }
    }
  });
  return out;
}
async function handleImportFile(file){
  if(!file||!S.imp)return;
  S.imp.stage='reading';S.imp.fileName=file.name;refreshSheet('importSheet');
  try{const sheets=await readFile(file);derive();const plan=S.imp.kind==='staff'?planStaff(sheets):planFees(sheets);S.imp.plan=plan;S.imp.stage=plan.found.length?'preview':'none';}
  catch(e){console.warn(e);S.imp.stage='error';S.imp.err=e&&e.code==='xls'?t('imp_xls'):e&&e.code==='lib'?t('libFail'):t('imp_fail');}
  refreshSheet('importSheet');
}
async function runImport(){
  const I=S.imp;if(!I||!I.plan||I.stage!=='preview')return;
  if(S.store!=='live'){toast(t('e_off'),'bad');return;}
  const ops=[];
  I.plan.items.forEach(it=>{
    ops.push(()=>it.isNew?dbSet(it.col+'/'+it.id,Object.assign({},it.data,stamp(true))):dbUpdate(it.col+'/'+it.id,Object.assign({},it.data,stamp(false))));
    if(it.pay)ops.push(()=>it.payNew?dbSet('payroll/'+it.id,Object.assign({basic:0,housing:0,transport:0,other:0},it.pay,stamp(false))):dbUpdate('payroll/'+it.id,Object.assign({},it.pay,stamp(false))));
  });
  I.stage='running';I.done=0;I.total=ops.length;I.err=null;refreshSheet('importSheet');
  try{await pool(ops,4,()=>{I.done++;if(I.done%4===0||I.done===I.total)refreshSheet('importSheet');});}catch(e){I.err=e;}
  I.stage='done';refreshSheet('importSheet');
  if(I.err)toast(errMsg(I.err),'bad');else toast(t('imp_done',I.plan.items.length));
}

async function runExport(r,f,id){
  if(S.exporting)return;

/* ---------- Excel writer ---------- */
function setCell(cell,v,c){
  if(v==null||v==='')return;const ty=(c&&c.type)||'text';
  if(ty==='money'){cell.value=Number(v)||0;cell.numFmt='#,##0.00';}
  else if(ty==='num'){const n=Number(v);cell.value=isFinite(n)?n:String(v);}
  else if(ty==='pct'){const n=Number(v);if(isFinite(n)){cell.value=n/100;cell.numFmt='0%';}else cell.value=String(v);}
  else if(ty==='date'){const p=String(v).split('-').map(Number);if(p.length===3&&p[0]){cell.value=new Date(Date.UTC(p[0],p[1]-1,p[2]));cell.numFmt='yyyy-mm-dd';}else cell.value=String(v);}
  else cell.value=String(v);
  if(c&&c.center)cell.alignment={horizontal:'center'};
}
async function buildXlsx(rep){
  const EX=await xlsxLib(),wb=new EX.Workbook(),rtl=S.lang==='ar',used=new Set();
  wb.creator=t('ledgerName');wb.created=new Date();
  const sheetName=n=>{let s=String(n).replace(/[\[\]*?\/\\:]/g,' ').trim().slice(0,31)||'Sheet';const b=s;let i=2;while(used.has(s.toLowerCase()))s=b.slice(0,28)+' '+(i++);used.add(s.toLowerCase());return s;};
  rep.sheets.forEach(sh=>{
    const hdr=sh.plain?1:4;
    const ws=wb.addWorksheet(sheetName(sh.name),{views:[{rightToLeft:rtl,state:'frozen',xSplit:0,ySplit:hdr}]});
    if(!sh.plain){const a=ws.getCell(1,1);a.value=sh.title||rep.title;a.font={bold:true,size:14,color:{argb:'FF6B1F2E'}};const b=ws.getCell(2,1);b.value=rep.sub||'';b.font={size:10,color:{argb:'FF857B7D'}};}
    const hr=ws.getRow(hdr);hr.height=22;
    sh.columns.forEach((c,i)=>{const cell=hr.getCell(i+1);cell.value=c.label;cell.font={bold:true,color:{argb:'FFFBF3E3'}};cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF5C1A28'}};cell.alignment={vertical:'middle',horizontal:(c.type==='money'||c.type==='num'||c.type==='pct'||c.center)?'center':(rtl?'right':'left')};});
    let r=hdr;
    sh.rows.forEach(row=>{r++;const xr=ws.getRow(r);row.forEach((v,i)=>setCell(xr.getCell(i+1),v,sh.columns[i]));});
    if(sh.totals&&sh.rows.length){r++;const xr=ws.getRow(r);sh.totals.forEach((v,i)=>{const cell=xr.getCell(i+1);if(v!==''&&v!=null)setCell(cell,v,typeof v==='string'?{type:'text'}:sh.columns[i]);cell.font={bold:true};cell.border={top:{style:'thin',color:{argb:'FF171314'}}};});}
    if(sh.note){r+=2;const c=ws.getCell(r,1);c.value=sh.note;c.font={italic:true,color:{argb:'FF857B7D'}};}
    sh.columns.forEach((c,i)=>{let w=String(c.label).length;sh.rows.forEach(row=>{const v=row[i];const l=v==null||v===''?0:c.type==='money'?13:c.type==='date'?11:String(v).length;if(l>w)w=l;});ws.getColumn(i+1).width=Math.min(46,Math.max(c.center?6:9,w+3));if(c.type==='code')ws.getColumn(i+1).numFmt='@';});
    if(sh.rows.length)ws.autoFilter={from:{row:hdr,column:1},to:{row:hdr,column:sh.columns.length}};
    if(sh.template)sh.columns.forEach((c,i)=>{if(!c.list||!c.list.length)return;const fm='"'+c.list.join(',')+'"';if(fm.length>255)return;for(let k=hdr+1;k<=hdr+300;k++)ws.getCell(k,i+1).dataValidation={type:'list',allowBlank:true,showErrorMessage:false,formulae:[fm]};});
  });
  if(rep.readme){const ws=wb.addWorksheet(sheetName(t('sh_readme')),{views:[{rightToLeft:rtl}]});ws.getColumn(1).width=110;const h=ws.getCell(1,1);h.value=t('rm_title');h.font={bold:true,size:13,color:{argb:'FF6B1F2E'}};rep.readme.forEach((l,i)=>{const c=ws.getCell(i+3,1);c.value=l;c.alignment={wrapText:true,vertical:'top',horizontal:rtl?'right':'left'};});}
  const buf=await wb.xlsx.writeBuffer();
  return new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

/* ---------- PDF writer (pages drawn on canvas, embedded as JPEG) ---------- */
const PDFC={ink:'#171314',ink2:'#4d4547',mute:'#857b7d',rule:'#e6dfdc',rule2:'#cfc5c2',wash:'#f6f3f1',brand:'#6b1f2e',gold:'#94701c',bad:'#b4261d',ok:'#2c6a3d'};
const TONE={bad:PDFC.bad,ok:PDFC.ok,mute:PDFC.mute,gold:PDFC.gold};
const PF={body:'"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif',disp:'"Reem Kufi","IBM Plex Sans Arabic",sans-serif',mono:'"IBM Plex Mono",Menlo,Consolas,monospace'};
const PK=2.5;
async function pdfFonts(){
  if(!document.fonts||!document.fonts.load)return;
  const sample='العربية English 0123456789';
  try{await Promise.race([Promise.all(['400','500','600'].map(w=>document.fonts.load(w+' 20px "IBM Plex Sans Arabic"',sample)).concat([document.fonts.load('600 20px "Reem Kufi"',sample),document.fonts.load('400 20px "IBM Plex Mono"','RCPT-0123')])),sleep(4000)]);}catch(e){}
}
function pfont(size,weight,fam){return (weight||400)+' '+size+'px '+PF[fam||'body'];}
function fitText(X,s,max){if(X.measureText(s).width<=max)return s;let lo=0,hi=s.length;while(lo<hi){const m=(lo+hi+1)>>1;if(X.measureText(s.slice(0,m)+'…').width<=max)lo=m;else hi=m-1;}return s.slice(0,lo).trimEnd()+'…';}
function ptxt(P,s,x,y,o){const X=P.x;X.font=pfont(o.size||8.3,o.weight||400,o.fam);X.fillStyle=o.color||PDFC.ink;X.textAlign=o.align||'left';let str=String(s==null?'':s);if(o.max)str=fitText(X,str,o.max);if(P.rtl&&str)str='⁧'+str+'⁩';X.fillText(str,x,y);}
function hline(P,x0,x1,y,color,w,dash){const X=P.x;X.save();X.strokeStyle=color;X.lineWidth=w||.5;if(dash)X.setLineDash(dash);X.beginPath();X.moveTo(x0,y);X.lineTo(x1,y);X.stroke();X.restore();}

async function buildPdf(rep){
  await pdfFonts();
  const rtl=S.lang==='ar',PW=rep.landscape?841.89:595.28,PH=rep.landscape?595.28:841.89,TOP=90,BOT=PH-48,RH=17,HH=18;
  const blocks=[];
  if(rep.summary&&rep.summary.length)blocks.push({k:'sum',h:54});
  rep.sections.forEach(s=>{if(s.heading)blocks.push({k:'head',h:22,s,keep:1});if(s.note)blocks.push({k:'note',h:14,s,keep:1});blocks.push({k:'thead',h:HH,s,keep:1});if(!s.rows.length)blocks.push({k:'empty',h:RH,s});s.rows.forEach(r=>blocks.push({k:'row',h:RH,s,r}));if(s.totals&&s.rows.length)blocks.push({k:'tot',h:19,s});blocks.push({k:'gap',h:16});});
  const pages=[[]];let y=TOP;
  for(let i=0;i<blocks.length;i++){
    const b=blocks[i];
    if(b.k==='gap'){if(y+b.h<=BOT)y+=b.h;continue;}
    let need=b.h;if(b.keep){need=0;let j=i;while(j<blocks.length&&blocks[j].keep){need+=blocks[j].h;j++;}if(j<blocks.length)need+=blocks[j].h;}
    if(y+need>BOT&&pages[pages.length-1].length){pages.push([]);y=TOP;if(b.k==='row'||b.k==='tot'||b.k==='empty'){pages[pages.length-1].push({k:'thead',h:HH,s:b.s,y});y+=HH;}}
    pages[pages.length-1].push(Object.assign({},b,{y}));y+=b.h;
  }
  const cv=newCanvas(PW,PH),out=[];
  for(let pi=0;pi<pages.length;pi++){
    const P=startPage(cv,PW,PH,rtl);
    drawHead(P,rep);pages[pi].forEach(b=>drawBlock(P,b,rep));drawFoot(P,pi+1,pages.length);
    out.push({jpeg:await canvasJpeg(cv),w:cv.width,h:cv.height,pw:PW,ph:PH});
  }
  rep.sections.forEach(s=>{delete s._bx;});
  return pdfBlob(out,rep.title+(cfg().name?' · '+cfg().name:''));
}

function pdfStr(s){let h='FEFF';for(let i=0;i<s.length;i++)h+=s.charCodeAt(i).toString(16).padStart(4,'0');return '<'+h.toUpperCase()+'>';}
function pdfBlob(pages,title){
  const enc=new TextEncoder(),parts=[],off=[];let len=0;
  const put=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length;};
  const n=pages.length,info=3+3*n,size=info+1;
  const begin=k=>{off[k]=len;put(k+' 0 obj\n');},end=()=>put('\nendobj\n');
  put(new Uint8Array([37,80,68,70,45,49,46,52,10,37,226,227,207,211,10]));
  begin(1);put('<< /Type /Catalog /Pages 2 0 R >>');end();
  begin(2);put('<< /Type /Pages /Kids ['+pages.map((_,i)=>(3+3*i)+' 0 R').join(' ')+'] /Count '+n+' >>');end();
  pages.forEach((p,i)=>{const po=3+3*i,co=po+1,io=po+2,W=p.pw.toFixed(2),H=p.ph.toFixed(2);
    begin(po);put(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im${i} ${io} 0 R >> >> /Contents ${co} 0 R >>`);end();
    const cs=`q ${W} 0 0 ${H} 0 0 cm /Im${i} Do Q`;
    begin(co);put(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);end();
    begin(io);put(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpeg.length} >>\nstream\n`);put(p.jpeg);put('\nendstream');end();});
  const d=new Date(),ds='D:'+d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z';
  begin(info);put(`<< /Title ${pdfStr(title||'')} /Producer (School Office Ledger) /CreationDate (${ds}) >>`);end();
  const xref=len;put(`xref\n0 ${size}\n0000000000 65535 f \n`);for(let k=1;k<size;k++)put(String(off[k]).padStart(10,'0')+' 00000 n \n');
  put(`trailer\n<< /Size ${size} /Root 1 0 R /Info ${info} 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts,{type:'application/pdf'});
}

function demoDb(){
  const docs=new Map(),colL=new Map(),docL=new Map(),pending=new Set();let timer=0;
  const clone=o=>o===undefined?undefined:JSON.parse(JSON.stringify(o));
  const colOf=p=>p.split('/')[0];
  const rid=()=>Array.from({length:20},()=>'abcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random()*36)]).join('');
  function flush(){timer=0;const ps=[...pending];pending.clear();new Set(ps.map(colOf)).forEach(c=>(colL.get(c)||[]).slice().forEach(fn=>fn()));ps.forEach(p=>(docL.get(p)||[]).slice().forEach(fn=>fn()));}
  function notify(p){pending.add(p);if(!timer)timer=setTimeout(flush,0);}
  function snapCol(c){const out=[];docs.forEach((v,k)=>{const seg=k.split('/');if(seg.length===2&&seg[0]===c)out.push({id:seg[1],exists:true,data:()=>clone(v)});});return {docs:out,metadata:{fromCache:false}};}
  function snapDoc(p){const v=docs.get(p);return {id:p.split('/').pop(),exists:v!==undefined,data:()=>clone(v),metadata:{fromCache:false}};}
  function merge(a,b){Object.keys(b).forEach(k=>{const v=b[k];if(v&&typeof v==='object'&&!Array.isArray(v)&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))merge(a[k],v);else a[k]=clone(v);});return a;}
  function listen(map,key,l){if(!map.has(key))map.set(key,[]);map.get(key).push(l);setTimeout(l,0);return ()=>{const a=map.get(key)||[],i=a.indexOf(l);if(i>-1)a.splice(i,1);};}
  function doc(path){return {id:path.split('/').pop(),path,
    get:async()=>snapDoc(path),
    set:async d=>{docs.set(path,clone(d));notify(path);},
    update:async d=>{const cur=docs.get(path);if(cur===undefined)throw {code:'invalid_argument'};merge(cur,d);notify(path);},
    delete:async()=>{docs.delete(path);notify(path);},
    acquire:async()=>({acquired:true}),
    onSnapshot:(fn)=>listen(docL,path,()=>fn(snapDoc(path)))};}
  function collection(c){return {doc:id=>doc(c+'/'+(id||rid())),onSnapshot:(fn)=>listen(colL,c,()=>fn(snapCol(c)))};}
  return {doc,collection,
    _raw:docs,_notify:notify,
    _load(list){list.forEach(w=>docs.set(w.path,clone(w.data)));},
    _clear(){docs.clear();},
    _touchAll(){colL.forEach((_,c)=>pending.add(c+'/*'));docL.forEach((_,p)=>pending.add(p));if(!timer)timer=setTimeout(flush,0);}};
}
